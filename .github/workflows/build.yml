name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian/mixin
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.8.13'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          archivesBaseName = "sbx_frag_7"
          repositories { 
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              // 加入 Fabric API（使用确定存在的版本）
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.96.0+1.21.1"
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "sbx_frag_7"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变黑曜石/哭泣黑曜石纹理（含地面）",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "mixins": ["namedobsidian.mixins.json"],
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1",
              "fabric-api": ">=0.96.0"
            }
          }
          EOF

          cat > src/main/resources/namedobsidian.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.namedobsidian.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["PlaceMixin", "BlockRenderDispatcherMixin", "BlockRemoveMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianMod.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ModInitializer;
          public class NamedObsidianMod implements ModInitializer {
              @Override public void onInitialize() {}
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianClient.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.model.ModelPredicateProviderRegistry;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.item.Items;
          public class NamedObsidianClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ModelPredicateProviderRegistry.register(Items.OBSIDIAN,
                      ResourceLocation.withDefaultNamespace("void"),
                      (stack, world, entity, seed) -> {
                          if (stack.hasCustomName() && "Void.exp".equals(stack.getCustomName().getString())) {
                              return 1.0f;
                          }
                          return 0.0f;
                      }
                  );
                  ModelPredicateProviderRegistry.register(Items.CRYING_OBSIDIAN,
                      ResourceLocation.withDefaultNamespace("sky"),
                      (stack, world, entity, seed) -> {
                          if (stack.hasCustomName() && "<SKY.GEM>".equals(stack.getCustomName().getString())) {
                              return 1.0f;
                          }
                          return 0.0f;
                      }
                  );
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/ObsidianData.java <<'EOF'
          package com.example.namedobsidian;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.Level;
          import java.util.concurrent.ConcurrentHashMap;
          public class ObsidianData {
              private static final ConcurrentHashMap<BlockPos, String> MAP = new ConcurrentHashMap<>();
              public static void putName(BlockPos pos, String name) { MAP.put(pos, name); }
              public static String getClientName(Level world, BlockPos pos) { return MAP.get(pos); }
              public static void remove(BlockPos pos) { MAP.remove(pos); }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/PlaceMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.context.BlockPlaceContext;
          import net.minecraft.world.level.Level;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          @Mixin(BlockItem.class)
          public class PlaceMixin {
              @Inject(method = "place", at = @At("RETURN"))
              private void onPlace(BlockPlaceContext context, CallbackInfoReturnable<InteractionResult> cir) {
                  if (cir.getReturnValue().consumesAction() && context.getItemInHand().hasCustomName()) {
                      Level world = context.getLevel();
                      if (world.isClientSide()) {
                          BlockPos pos = context.getClickedPos();
                          String name = context.getItemInHand().getCustomName().getString();
                          ObsidianData.putName(pos, name);
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/BlockRenderDispatcherMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.block.BlockRenderDispatcher;
          import net.minecraft.client.resources.model.BakedModel;
          import net.minecraft.client.resources.model.ModelResourceLocation;
          import net.minecraft.core.BlockPos;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.BlockAndTintGetter;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          @Mixin(BlockRenderDispatcher.class)
          public class BlockRenderDispatcherMixin {
              @ModifyVariable(method = "renderBlock", at = @At("HEAD"), argsOnly = true, index = 3)
              private BakedModel replaceModel(BakedModel original, BlockState state, BlockPos pos, BlockAndTintGetter world) {
                  if (world instanceof Level && ((Level) world).isClientSide()) {
                      String name = ObsidianData.getClientName((Level) world, pos);
                      if (name != null) {
                          Minecraft client = Minecraft.getInstance();
                          if (state.getBlock() == Blocks.OBSIDIAN && "Void.exp".equals(name)) {
                              ModelResourceLocation modelLoc = new ModelResourceLocation(
                                  ResourceLocation.withDefaultNamespace("block/obsidian_void"), "");
                              BakedModel custom = client.getModelManager().getModel(modelLoc);
                              if (custom != null) return custom;
                          } else if (state.getBlock() == Blocks.CRYING_OBSIDIAN && "<SKY.GEM>".equals(name)) {
                              ModelResourceLocation modelLoc = new ModelResourceLocation(
                                  ResourceLocation.withDefaultNamespace("block/crying_obsidian_sky"), "");
                              BakedModel custom = client.getModelManager().getModel(modelLoc);
                              if (custom != null) return custom;
                          }
                      }
                  }
                  return original;
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/BlockRemoveMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          @Mixin(Block.class)
          public class BlockRemoveMixin {
              @Inject(method = "onRemove", at = @At("HEAD"))
              private void onRemove(BlockState state, Level world, BlockPos pos, BlockState newState, boolean moved, CallbackInfo ci) {
                  if (world.isClientSide()) ObsidianData.remove(pos);
              }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/obsidian_void.json <<'EOF'
          {"parent":"minecraft:block/cube_all","textures":{"all":"minecraft:block/obsidian_void"}}
          EOF
          cat > src/main/resources/assets/minecraft/models/block/crying_obsidian_sky.json <<'EOF'
          {"parent":"minecraft:block/cube_all","textures":{"all":"minecraft:block/crying_obsidian_sky"}}
          EOF
          cat > src/main/resources/assets/minecraft/models/item/obsidian.json <<'EOF'
          {"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/obsidian"},"overrides":[{"predicate":{"minecraft:void":1},"model":"minecraft:item/obsidian_void"}]}
          EOF
          cat > src/main/resources/assets/minecraft/models/item/obsidian_void.json <<'EOF'
          {"parent":"minecraft:block/obsidian_void"}
          EOF
          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian.json <<'EOF'
          {"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/crying_obsidian"},"overrides":[{"predicate":{"minecraft:sky":1},"model":"minecraft:item/crying_obsidian_sky"}]}
          EOF
          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian_sky.json <<'EOF'
          {"parent":"minecraft:block/crying_obsidian_sky"}
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
